# 사용법: 저장소 루트에서  docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# 비밀값(JWT_SECRET, DB_PASSWORD 등)은 전부 .env 에서 읽는다. 이 파일에는 적지 않는다.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    environment:
      PORT: 4000
      TRUST_PROXY: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: postgres://chat:${DB_PASSWORD}@db:5432/chat
      # llama-server 는 호스트에서 돌린다. host-gateway = 도커 호스트
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
